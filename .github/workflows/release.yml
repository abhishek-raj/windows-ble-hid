name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Must be Windows: the project targets net8.0-windows10.0.19041.0 and uses WinRT projections.
    runs-on: windows-latest

    strategy:
      matrix:
        rid: [win-x64, win-arm64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: >
          dotnet publish src/BleHid.Cli/BleHid.Cli.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=none
          -o artifacts/${{ matrix.rid }}

      - name: Package
        run: |
          Copy-Item LICENSE, README.md artifacts/${{ matrix.rid }}
          Compress-Archive -Path artifacts/${{ matrix.rid }}/* -DestinationPath BleHid-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BleHid-${{ matrix.rid }}
          path: BleHid-${{ matrix.rid }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: '*.zip'
          draft: true
          generate_release_notes: true
